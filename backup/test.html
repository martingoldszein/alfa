  <style>
    @keyframes af-spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .af-orbit {
      transform-box: fill-box;
      transform-origin: center center;
      animation: af-spin 600s linear infinite;
      /* Muy lento: 10 min por rotación */
    }
  </style>
