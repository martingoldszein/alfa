        .consent button.secondary:hover {
            background: var(--hov);
            filter: none
        }

        .consent:focus {
            outline: none
        }

        .consent button:disabled {
            opacity: .5;
            filter: none;
            cursor: default;
            pointer-events: none
        }

        #org-switch {
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
            display: flex
        }

        .err-actions #org-switch {
            margin-top: 0
        }

        #org-caption {
            text-align: center;
            color: var(--mut);
            margin-top: 12px;
            font-size: 12px;
            display: block
        }

        .org-menu-wrap {
            position: relative
        }

        #org-switch .org-trigger {
            border: 1px solid var(--bord);
            color: var(--fg);
            border-radius: 8px;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-family: anthropic-sans, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex
        }

        #org-switch .org-trigger:hover {
            background: var(--hov)
        }

        #org-switch .org-caret {
            opacity: .6
        }

        .org-menu {
            z-index: 30;
            background: var(--surf);
            border: 1px solid var(--bord);
            border-radius: 10px;
            flex-direction: column;
            min-width: 180px;
            max-width: 320px;
            max-height: 240px;
            padding: 4px;
            display: flex;
            position: absolute;
            top: calc(100% + 4px);
            left: 50%;
            overflow-y: auto;
            transform: translate(-50%);
            box-shadow: 0 4px 16px #0000001f
        }

        .org-menu .org-item {
            width: 100%;
            color: var(--fg);
            text-align: left;
            border-radius: 6px;
            flex-shrink: 0;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            font-size: 13px;
            display: flex
        }

        .org-menu .org-item:hover,
        .org-menu .org-item:focus {
            background: var(--hov);
            outline: none
        }

        .org-menu .org-item:focus-visible {
            outline: 2px solid var(--fg);
            outline-offset: -2px
        }

        .org-menu .org-check {
            flex-shrink: 0;
            justify-content: center;
            align-items: center;
            width: 14px;
            height: 14px;
            display: inline-flex
        }

        .org-menu .org-name {
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            min-width: 0;
            overflow: hidden
        }

        @media print {

            body>:not(main):not(#err),
            #loading,
            .consent,
            #frame-slot>iframe.fading-out {
                display: none !important
            }

            html:root {
                --bg: #fff;
                --fg: #222;
                --mut: #555;
                --line: #ccc;
                --lightningcss-light: initial;
                --lightningcss-dark: ;
                color-scheme: light
            }

            html,
            body,
            #err {
                height: auto;
                overflow: visible
            }

            main,
            #frame-slot,
            #err,
            #frame-content {
                position: static
            }

            main {
                display: block
            }

            #frame-content {
                width: 100%;
                height: var(--frame-print-h, 100vh);
                opacity: 1
            }
        }
    </style>

        @layer theme {

            :root,
            :host {
                --spacing: .25rem;

                --leading-relaxed: 1.625;

        @layer base {
            @layer {

                :where(.cds-root),
